version: '3.8'

services:

  # ─── Infrastructure (Ports Zone 44xx / 84xx) ─────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: creativeai-postgres
    environment:
      POSTGRES_USER: creativeai
      POSTGRES_PASSWORD: creativeai123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5436:5432" # Libre
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creativeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: creativeai-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6383:6379" # Libre
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: creativeai-kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19095:19092" # Libre
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: creativeai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: creativeai
      MINIO_ROOT_PASSWORD: creativeai123
      MINIO_SERVER_URL: http://localhost:9400
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9400:9000" # Libre
      - "127.0.0.1:9401:9001" # Libre

  pgadmin:
    image: dpage/pgadmin4
    container_name: creativeai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mediacore.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      - postgres

  # ─── Observabilité ─────────────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: creativeai-otel
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./infra/otel/otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:latest
    container_name: creativeai-prometheus
    volumes:
      - ./infra/otel/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9092:9090" # Libre

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: creativeai-jaeger
    ports:
      - "127.0.0.1:16688:16686" # Libre
      - "127.0.0.1:14252:14250" # Libre

  grafana:
    image: grafana/grafana:latest
    container_name: creativeai-grafana
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3002:3000" # Libre

  # ─── Java Services ──────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
      target: api-gateway
    container_name: creativeai-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_HOST: auth-service
      SEARCH_SERVICE_HOST: search-service
      DOCFUSION_SERVICE_HOST: docfusion-service
      RAG_SERVICE_HOST: creativeai-rag
      AGENT_TEAM_SERVICE_HOST: agent-team-service
      REDIS_HOST: redis
      JWT_SECRET: creativeai-super-secret-key-that-is-long-enough-for-hs256
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Hôtes acceptés pour l'URL de sortie du callback OnlyOffice (anti-SSRF).
      # 'onlyoffice' = service du réseau Docker. Voir AUDIT-2026-09-27.md.
      OFFICE_CALLBACK_ALLOWED_HOSTS: ${OFFICE_CALLBACK_ALLOWED_HOSTS:-onlyoffice}
    volumes:
      # Monter l'application.yml mis à jour (avec route /api/rag/**) — priorité sur le JAR
      - ./backend-java/api-gateway/src/main/resources/application.yml:/app/application.yml:ro
    ports:
      - "127.0.0.1:8480:8080" # ACCÈS API : http://localhost:8480
    depends_on:
      - auth-service
      - search-service
      - rag-service

  auth-service:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
      target: auth-service
    container_name: creativeai-auth
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: creativeai
      DB_PASSWORD: creativeai123
      JWT_SECRET: creativeai-super-secret-key-that-is-long-enough-for-hs256
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MINIO_URL: http://minio:9000
      # Doit être le MÊME hôte que pour generation-service : agent-team reconnaît
      # les URLs MinIO par prefixe (ChannelSenderService.isMinioUrl) et réécrit
      # l'hôte pour Instagram (resolvePublicImageUrl). Deux valeurs différentes =
      # publication Facebook/Instagram cassée.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9400}
      MINIO_ACCESS_KEY: creativeai
      MINIO_SECRET_KEY: creativeai123
      # Gmail OAuth2 — renseigner dans .env avant docker compose up
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8480/api/auth/gmail/callback}
      GMAIL_FRONTEND_REDIRECT: ${GMAIL_FRONTEND_REDIRECT:-http://localhost:4400/agentique/email}
      # Agent Email
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Q3JlYXRpdmVBSVN0dWRpb0tleUNoYW5nZU1lSW5Qcm9k}
      RAG_SERVICE_URL: http://creativeai-rag:8084
      # SMTP OTP — secret fourni par .env (jamais en clair dans le dépôt)
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-contact@labibpro.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
      target: search-service
    container_name: creativeai-search
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_HOST: redis
      MINIO_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      minio:
        condition: service_started

  # ─── Java DocFusion Service ─────────────────────────────────────────────────

  docfusion-service:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
      target: docfusion-service
    container_name: creativeai-docfusion
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: creativeai
      DB_PASSWORD: creativeai123
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_HOST: redis
      MINIO_URL: http://minio:9000
      # Doit être le MÊME hôte que pour generation-service : agent-team reconnaît
      # les URLs MinIO par prefixe (ChannelSenderService.isMinioUrl) et réécrit
      # l'hôte pour Instagram (resolvePublicImageUrl). Deux valeurs différentes =
      # publication Facebook/Instagram cassée.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9400}
      MINIO_ACCESS_KEY: creativeai
      MINIO_SECRET_KEY: creativeai123
      JWT_SECRET: creativeai-super-secret-key-that-is-long-enough-for-hs256
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      minio:
        condition: service_started

  # ─── RAG Service (Spring AI + Groq + pgvector) ─────────────────────────────

  rag-service:
    build:
      context: ./backend-java
      dockerfile: rag-service/Dockerfile
    container_name: creativeai-rag
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=creativeai
      - POSTGRES_PASSWORD=creativeai123
      - GROQ_API_KEY=${GROQ_API_KEY}
      # llama-3.1-8b-instant a ete retire de Groq (404 model_not_found).
      # Modeles texte servis par ce compte : openai/gpt-oss-20b,
      # openai/gpt-oss-120b, qwen/qwen3.8-27b
      - RAG_CHAT_MODEL=${RAG_CHAT_MODEL:-openai/gpt-oss-20b}
      # Aucun modele vision sur ce compte Groq. Laisser vide plutot que
      # pointer un modele retire : l'analyse d'image echouera proprement.
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-}
      - SPRING_AI_OPENAI_BASE_URL=https://api.groq.com/openai
      # Cache ONNX — monté directement sur le chemin interne de Spring AI
      - SPRING_AI_TRANSFORMERS_CACHE_DIRECTORY=/tmp/spring-ai-onnx-generative
    volumes:
      - rag_onnx_cache:/tmp/spring-ai-onnx-generative
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Python AI Workers ──────────────────────────────────────────────────────

  audio-worker:
    build: ./ai-workers/audio-worker
    container_name: creativeai-audio-ai
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redpanda:
        condition: service_healthy

  face-worker:
    build: ./ai-workers/face-worker
    container_name: creativeai-face-ai
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SERP_API_KEY: ${SERP_API_KEY:-}
      NUMVERIFY_KEY: ${NUMVERIFY_KEY:-}
      BING_SEARCH_KEY: ${BING_SEARCH_KEY:-}
    depends_on:
      redpanda:
        condition: service_healthy

  video-worker:
    build: ./ai-workers/video-worker
    container_name: creativeai-video-ai
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      redpanda:
        condition: service_healthy

  video-generation-worker:
    profiles: ["video-generation"]
    build: ./ai-workers/video-generation-worker
    container_name: creativeai-video-generation
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      VIDEO_GENERATION_INPUT_TOPIC: ${VIDEO_GENERATION_INPUT_TOPIC:-creativeai.video-generation}
      VIDEO_GENERATION_RESULT_TOPIC: ${VIDEO_GENERATION_RESULT_TOPIC:-creativeai.video-generation.results}
      VIDEO_GENERATION_GROUP_ID: ${VIDEO_GENERATION_GROUP_ID:-video-generation-worker}
      VIDEO_GENERATION_PROVIDER: ${VIDEO_GENERATION_PROVIDER:-local}
      VIDEO_GENERATION_OLLAMA_URL: ${VIDEO_GENERATION_OLLAMA_URL:-http://ollama:11434}
      VIDEO_GENERATION_OLLAMA_MODEL: ${VIDEO_GENERATION_OLLAMA_MODEL:-qwen2.5:3b}
      VIDEO_GENERATION_LLM_PROVIDER: ${VIDEO_GENERATION_LLM_PROVIDER:-ollama}
      VIDEO_GENERATION_LLM_BASE_URL: ${VIDEO_GENERATION_LLM_BASE_URL:-}
      VIDEO_GENERATION_LLM_API_KEY: ${VIDEO_GENERATION_LLM_API_KEY:-}
      VIDEO_GENERATION_LLM_MODEL: ${VIDEO_GENERATION_LLM_MODEL:-}
      VIDEO_GENERATION_LLM_ALLOW_UNAUTHENTICATED: ${VIDEO_GENERATION_LLM_ALLOW_UNAUTHENTICATED:-false}
      VIDEO_GENERATION_LLM_TIMEOUT_SECONDS: ${VIDEO_GENERATION_LLM_TIMEOUT_SECONDS:-120}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      VIDEO_GENERATION_TTS_PROVIDER: ${VIDEO_GENERATION_TTS_PROVIDER:-espeak}
      VIDEO_GENERATION_TTS_BINARY: ${VIDEO_GENERATION_TTS_BINARY:-espeak-ng}
      VIDEO_GENERATION_EDGE_TTS_BINARY: ${VIDEO_GENERATION_EDGE_TTS_BINARY:-edge-tts}
      VIDEO_GENERATION_MUSIC_DIR: ${VIDEO_GENERATION_MUSIC_DIR:-}
      MONEYPRINTER_API_URL: ${MONEYPRINTER_API_URL:-}
      MONEYPRINTER_API_KEY: ${MONEYPRINTER_API_KEY:-}
      MONEYPRINTER_ALLOW_UNAUTHENTICATED: ${MONEYPRINTER_ALLOW_UNAUTHENTICATED:-false}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-creativeai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-creativeai123}
      VIDEO_GENERATION_OUTPUT_BUCKET: ${VIDEO_GENERATION_OUTPUT_BUCKET:-video-generation-results}
      VIDEO_GENERATION_MAX_OUTPUT_BYTES: ${VIDEO_GENERATION_MAX_OUTPUT_BYTES:-524288000}
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  image-generation-worker:
    profiles: ["image-generation"]
    build: ./ai-workers/image-generation-worker
    container_name: creativeai-image-generation
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      IMAGE_GENERATION_INPUT_TOPIC: ${IMAGE_GENERATION_INPUT_TOPIC:-creativeai.image-generation}
      IMAGE_GENERATION_RESULT_TOPIC: ${IMAGE_GENERATION_RESULT_TOPIC:-creativeai.image-generation.results}
      IMAGE_GENERATION_GROUP_ID: ${IMAGE_GENERATION_GROUP_ID:-image-generation-worker}
      IMAGE_PROVIDER_URL: ${IMAGE_PROVIDER_URL:-}
      IMAGE_PROVIDER_API_KEY: ${IMAGE_PROVIDER_API_KEY:-}
      IMAGE_PROVIDER_ALLOW_UNAUTHENTICATED: ${IMAGE_PROVIDER_ALLOW_UNAUTHENTICATED:-false}
      IMAGE_PROVIDER_AUTH_HEADER: ${IMAGE_PROVIDER_AUTH_HEADER:-Authorization}
      IMAGE_PROVIDER_AUTH_SCHEME: ${IMAGE_PROVIDER_AUTH_SCHEME:-Bearer}
      IMAGE_PROVIDER_API_PATH: ${IMAGE_PROVIDER_API_PATH:-/v1/images/generations}
      IMAGE_PROVIDER_SUPPORTS_NEGATIVE_PROMPT: ${IMAGE_PROVIDER_SUPPORTS_NEGATIVE_PROMPT:-false}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-creativeai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-creativeai123}
      IMAGE_GENERATION_OUTPUT_BUCKET: ${IMAGE_GENERATION_OUTPUT_BUCKET:-image-generation-results}
      IMAGE_GENERATION_MAX_OUTPUT_BYTES: ${IMAGE_GENERATION_MAX_OUTPUT_BYTES:-33554432}
      IMAGE_GENERATION_MAX_IMAGE_COUNT: ${IMAGE_GENERATION_MAX_IMAGE_COUNT:-4}
      IMAGE_GENERATION_REQUEST_TIMEOUT_SECONDS: ${IMAGE_GENERATION_REQUEST_TIMEOUT_SECONDS:-120}
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  pdf-worker:
    build: ./ai-workers/pdf-worker
    container_name: creativeai-pdf-ai
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: creativeai
      MINIO_SECRET_KEY: creativeai123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redpanda:
        condition: service_healthy

  ocr-worker:
    build: ./ai-workers/ocr-worker
    container_name: creativeai-ocr-ai
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: creativeai
      MINIO_SECRET_KEY: creativeai123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Groq Vision LLM — obtenez une cle gratuite sur https://console.groq.com
      # Sans cle : fallback Tesseract (plus lent mais fonctionnel)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_OCR_MODEL: ${GROQ_OCR_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
    depends_on:
      redpanda:
        condition: service_healthy

  # ─── Kafka DLQ topic init (one-shot) ──────────────────────────────────────
  # Crée les topics dead-letter une seule fois au démarrage du cluster.

  kafka-topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: creativeai-kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BROKER=redpanda:9092
        for TOPIC in \
          creativeai.audio creativeai.video creativeai.face \
          creativeai.pdf creativeai.ocr \
          creativeai.results creativeai.docfusion.results \
          creativeai.video-generation creativeai.video-generation.results \
          creativeai.image-generation creativeai.image-generation.results \
          creativeai.audio.dlq creativeai.video.dlq creativeai.face.dlq \
          creativeai.pdf.dlq creativeai.ocr.dlq \
          creativeai.results.dlq creativeai.docfusion.results.dlq \
          creativeai.video-generation.dlq creativeai.video-generation.results.dlq \
          creativeai.image-generation.dlq creativeai.image-generation.results.dlq; do
          rpk topic create $$TOPIC --brokers $$BROKER \
            --partitions 3 --replicas 1 2>/dev/null || true
        done
        # DLQ : rétention longue (7j) pour analyse post-mortem
        for DLQ in creativeai.audio.dlq creativeai.video.dlq creativeai.face.dlq \
                   creativeai.pdf.dlq creativeai.ocr.dlq \
                   creativeai.results.dlq creativeai.docfusion.results.dlq \
                   creativeai.video-generation.dlq creativeai.video-generation.results.dlq \
                   creativeai.image-generation.dlq creativeai.image-generation.results.dlq; do
          rpk topic alter-config $$DLQ \
            --set retention.ms=604800000 \
            --brokers $$BROKER 2>/dev/null || true
        done
        echo "Topics OK"
    restart: "no"

  # ─── OnlyOffice Document Server ─────────────────────────────────────────────

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: creativeai-onlyoffice
    environment:
      - JWT_ENABLED=false
      - USE_UNAUTHORIZED_STORAGE=true
      - SECURE_LINK_SECRET=tD6jjk0zduQjSr7MJl2P
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - ./infra/onlyoffice-local.json:/etc/onlyoffice/documentserver/local.json
      - ./infra/onlyoffice-forward-4400.conf:/etc/nginx/conf.d/forward-4400.conf:ro
    restart: unless-stopped

  # ─── RxResume v4 — CV Builder Pro (20+ templates professionnels) ───────────
  # Image unique full-stack (Next.js + NestJS + Playwright intégré)

  rxresume:
    image: ghcr.io/amruthpillai/reactive-resume:latest
    container_name: creativeai-rxresume
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=production
      - APP_URL=http://localhost:3101
      # PostgreSQL
      - DATABASE_URL=postgresql://creativeai:creativeai123@postgres:5432/rxresume
      # Redis
      - REDIS_URL=redis://redis:6379
      # Stockage local
      - LOCAL_STORAGE_PATH=/tmp/rxresume-uploads
      - STORAGE_PATH=/tmp/rxresume-uploads
      # Auth
      - AUTH_SECRET=rxresume-auth-secret-key-2026-creativeai
      - DISABLE_EMAIL_AUTH=false
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  # ─── Identité Visuelle ──────────────────────────────────────────────────────

  # Stub pour satisfaire la résolution DNS penpot-mcp dans le nginx interne de penpot-frontend
  penpot-mcp:
    image: nginx:alpine
    container_name: creativeai-penpot-mcp
    restart: unless-stopped

  # Penpot — Éditeur design vectoriel (logo, cartes, badges, identité visuelle)
  penpot-frontend:
    image: penpotapp/frontend:latest
    container_name: creativeai-penpot-frontend
    environment:
      - PENPOT_FLAGS=enable-registration enable-login disable-email-verification disable-mcp
    ports:
      - "127.0.0.1:9090:8080"
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
    restart: unless-stopped

  penpot-backend:
    image: penpotapp/backend:latest
    container_name: creativeai-penpot-backend
    environment:
      - PENPOT_FLAGS=enable-registration enable-login disable-email-verification
      - PENPOT_PUBLIC_URI=http://localhost:9090
      - PENPOT_DATABASE_URI=postgresql://postgres:5432/penpot
      - PENPOT_DATABASE_USERNAME=creativeai
      - PENPOT_DATABASE_PASSWORD=creativeai123
      - PENPOT_REDIS_URI=redis://redis/1
      - PENPOT_STORAGE_BACKEND=fs
      - PENPOT_STORAGE_FS_DIRECTORY=/opt/data/assets
      - PENPOT_TELEMETRY_ENABLED=false
      - PENPOT_SECRET_KEY=penpot-secret-key-creativeai-2026
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  penpot-exporter:
    image: penpotapp/exporter:latest
    container_name: creativeai-penpot-exporter
    environment:
      - PENPOT_FLAGS=enable-login
      - PENPOT_PUBLIC_URI=http://penpot-frontend
      - PENPOT_REDIS_URI=redis://redis/1
      - PENPOT_SECRET_KEY=penpot-secret-key-creativeai-2026
    depends_on:
      - redis
    restart: unless-stopped

  # Gotenberg — Génération automatique de cartes/badges depuis HTML → PDF/PNG
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: creativeai-gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--chromium-allow-list=.*"
    ports:
      - "127.0.0.1:3200:3000"
    restart: unless-stopped

  # ─── Agent Team Service ────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: creativeai-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"        # keep model loaded in RAM indefinitely
      OLLAMA_NUM_PARALLEL: "1"       # single request at a time (CPU-only)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-team-service:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
      target: agent-team-service
    container_name: creativeai-agent-team
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      SERVER_PORT: 8087
      DB_HOST: postgres
      DB_USER: creativeai
      DB_PASSWORD: creativeai123
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      JWT_SECRET: creativeai-super-secret-key-that-is-long-enough-for-hs256
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Q3JlYXRpdmVBSVN0dWRpb0tleUNoYW5nZU1lSW5Qcm9k}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-contact@labibpro.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # LlmGateway.decryptKey ne retombe sur ces variables d'env que si la cle
      # du provider en base est VIDE. Les providers DeepSeek de la prod ont une
      # cle chiffree avec une cle ENCRYPTION_KEY differente : sans ces variables,
      # decryptKey leve une exception "Decryption error" et tout appel LLM
      # (generation de storyboard, chat agent) echoue en 409.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      DEFAULT_MODEL: ${DEFAULT_MODEL:-openai/gpt-oss-20b}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MINIO_URL: http://minio:9000
      # Doit être le MÊME hôte que pour generation-service : agent-team reconnaît
      # les URLs MinIO par prefixe (ChannelSenderService.isMinioUrl) et réécrit
      # l'hôte pour Instagram (resolvePublicImageUrl). Deux valeurs différentes =
      # publication Facebook/Instagram cassée.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9400}
      MINIO_ACCESS_KEY: creativeai
      MINIO_SECRET_KEY: creativeai123
      FACEBOOK_POLLING_ENABLED: ${FACEBOOK_POLLING_ENABLED:-true}
      FACEBOOK_POLL_DELAY_MS: ${FACEBOOK_POLL_DELAY_MS:-60000}
      INSTAGRAM_POLLING_ENABLED: ${INSTAGRAM_POLLING_ENABLED:-true}
      INSTAGRAM_POLL_DELAY_MS: ${INSTAGRAM_POLL_DELAY_MS:-60000}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Secrets webhook. Absents = endpoint REFUSÉ (fail-closed, 503) : c'est
      # volontaire. Avant, un secret manquant signifiait « signature non
      # vérifiée, requête acceptée » — l'arrêt d'un conteneur suffisait à
      # ouvrir la porte. Voir WebhookVerifier.
      # Telegram : n'accepte que [A-Za-z0-9_-]{1,256} chez setWebhook.
      FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8480}
      # Secret partagé avec generation-service pour la publication programmée.
      # Doit être identique des deux côtés (cf. INTERNAL_SERVICE_TOKEN ci-dessus).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started
      ollama:
        condition: service_started
      minio:
        condition: service_started
      # MediaController est fail-closed : sans scanner, les uploads répondent 503.
      # `service_started` (et non `service_healthy`) ordonne le démarrage sans
      # coupler la disponibilité des uploads à celle du scanner.
      file-security-service:
        condition: service_started
    volumes:
      - ./backend-java/agent-team-service/target/agent-team-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    restart: unless-stopped

  # ─── Generation Service (orchestrateur vidéo/image + publication sociale) ───

  generation-service:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
      target: generation-service
    container_name: creativeai-generation
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_USER: creativeai
      DB_PASSWORD: creativeai123
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      JWT_SECRET: creativeai-super-secret-key-that-is-long-enough-for-hs256
      MINIO_URL: http://minio:9000
      # Endpoint signe pour les URLs presignees : doit etre joignable depuis le
      # navigateur et les API de Meta. En local, MinIO est expose sur 9400.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9400}
      MINIO_ACCESS_KEY: creativeai
      MINIO_SECRET_KEY: creativeai123
      VIDEO_GENERATION_INPUT_TOPIC: creativeai.video-generation
      VIDEO_GENERATION_RESULT_TOPIC: creativeai.video-generation.results
      IMAGE_GENERATION_INPUT_TOPIC: creativeai.image-generation
      IMAGE_GENERATION_RESULT_TOPIC: creativeai.image-generation.results
      IMAGE_PROVIDER_CONFIGURED: ${IMAGE_PROVIDER_CONFIGURED:-false}
      # Publication sociale : désactivée par défaut, Facebook/Instagram sont
      # delegués a agent-team-service qui détient les credentials Meta.
      SOCIAL_PUBLISH_ENABLED: ${SOCIAL_PUBLISH_ENABLED:-false}
      AGENT_TEAM_BASE_URL: http://agent-team-service:8087
      # Secret partagé avec agent-team-service pour la publication programmée.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      minio:
        condition: service_started
      agent-team-service:
        condition: service_started
    volumes:
      - ./backend-java/generation-service/target/generation-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    restart: unless-stopped

  # ─── Telegram MCP Service ───────────────────────────────────────────────────

  telegram-mcp-service:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
      target: telegram-mcp-service
    container_name: creativeai-telegram-mcp
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      SERVER_PORT: 8092
      REDIS_HOST: redis
      AGENT_TEAM_BASE_URL: http://agent-team-service:8087
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      JWT_SECRET: creativeai-super-secret-key-that-is-long-enough-for-hs256
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-creativeai_bot}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - redis
      - agent-team-service
      - auth-service
    restart: unless-stopped

  # ─── Frontend ───────────────────────────────────────────────────────────────

  frontend:
    image: nginx:alpine
    container_name: creativeai-frontend
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:4400:80"
    depends_on:
      - api-gateway
    restart: unless-stopped


  # ── File Security Microservice (Magic Bytes, Antivirus, Sanitize) ────────
  file-security-service:
    build:
      context: ./file-security-service
      dockerfile: Dockerfile
    container_name: creativeai-file-security
    environment:
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - MAX_IMAGE_SIZE_MB=15
      - MAX_VIDEO_SIZE_MB=500
      - MAX_DOC_SIZE_MB=50
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  redis_data:
  postgres_data:
  minio_data:
  pgadmin_data:
  onlyoffice_data:
  onlyoffice_logs:
  penpot_assets:
  rxresume_uploads:
  rag_onnx_cache:
  ollama_data:
