spring.application.name=gateway-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docfusion}
spring.datasource.username=docfusion
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Security
spring.security.user.name=admin
spring.security.user.password=admin

application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# MinIO
application.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
application.minio.access-key=minioadmin
application.minio.secret-key=minioadmin
application.minio.bucket-name=docfusion
