server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Docker internal DNS — résolution dynamique (évite l'échec au démarrage si un upstream est down)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Assets statiques — cache long
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — jamais mis en cache (accès direct)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Angular SPA — toutes les routes → index.html SANS cache
    location / {
        try_files $uri $uri/ /index.html;
        # Forcer le no-cache sur index.html servi en fallback SPA
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # SSE streaming — agent chat (disable buffering)
    location /api/agent/email/chat {
        set $api_gw http://api-gateway:8080;
        proxy_pass         $api_gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Accel-Buffering no;
        proxy_read_timeout 300s;
        add_header         Cache-Control     no-cache;
        client_max_body_size 1M;
    }

    # Proxy vers l'API Gateway
    location /api/ {
        set $api_gw http://api-gateway:8080;
        proxy_pass         $api_gw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        client_max_body_size 100M;
    }

    # WebSocket pour le feedback temps réel
    location /ws/ {
        set $api_gw http://api-gateway:8080;
        proxy_pass          $api_gw;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # ─── RxResume CV Builder Pro ─────────────────────────────────────────────
    # ^~ = priorité max sur les regex locations (évite que *.js soit intercepté)
    # sub_filter = réécriture des chemins absolus dans HTML ET JS
    location ^~ /rxresume/ {
        set $rxresume http://rxresume:3000;
        proxy_pass         $rxresume/;
        proxy_http_version 1.1;
        proxy_set_header   Host               rxresume:3000;
        proxy_set_header   Origin             http://localhost:3101;
        proxy_set_header   Referer            http://localhost:3101/;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         $http_connection;
        proxy_read_timeout 300s;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
        add_header         X-Frame-Options "" always;
        # Réécriture des chemins absolus : HTML + JavaScript
        sub_filter_once    off;
        sub_filter_types   text/html application/javascript text/javascript;
        sub_filter         '"/assets/'     '"/rxresume/assets/';
        sub_filter         "'/assets/"     "'/rxresume/assets/";
        sub_filter         '"/favicon'     '"/rxresume/favicon';
        sub_filter         '"/manifest'    '"/rxresume/manifest';
        sub_filter         '"/apple-touch' '"/rxresume/apple-touch';
        sub_filter         '"/uploads/'    '"/rxresume/uploads/';
        sub_filter         '"/api/'        '"/rxresume/api/';
        sub_filter         "'/api/"        "'/rxresume/api/";
    }

    # ─── Penpot Design Studio (proxy pour supprimer X-Frame-Options) ─────────
    location ^~ /penpot/ {
        set $penpot_upstream http://penpot-frontend:8080;
        proxy_pass         $penpot_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host                   $http_host;
        proxy_set_header   X-Real-IP              $remote_addr;
        proxy_set_header   X-Forwarded-For        $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto      $scheme;
        proxy_set_header   Upgrade                $http_upgrade;
        proxy_set_header   Connection             $http_connection;
        proxy_read_timeout 3600s;
        # Supprimer le header X-Frame-Options du conteneur Penpot
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
        add_header         X-Frame-Options "" always;
        # Permettre l'iframe depuis la même origine (localhost:4400)
        add_header         Content-Security-Policy "frame-ancestors 'self' http://localhost:4400 http://localhost:9090;" always;
        client_max_body_size 200M;
    }

    # ─── OnlyOffice Document Server ──────────────────────────────────────────
    # ^~ empêche les blocs regex (*.js, *.css) d'intercepter les requêtes /office/
    location ^~ /office/ {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass         $onlyoffice_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host                   $http_host;
        proxy_set_header   X-Real-IP              $remote_addr;
        proxy_set_header   X-Forwarded-For        $proxy_add_x_forwarded_for;
        # $http_host inclut le port (ex: localhost:4400) — indispensable pour les redirects OnlyOffice
        proxy_set_header   X-Forwarded-Host       $http_host;
        proxy_set_header   X-Forwarded-Proto      $scheme;
        proxy_set_header   X-Forwarded-Port       $server_port;
        # Préfixe de chemin → OnlyOffice reconstruit ses URLs avec /office/
        proxy_set_header   X-Forwarded-Prefix     /office;
        # WebSocket
        proxy_set_header   Upgrade                $http_upgrade;
        proxy_set_header   Connection             $http_connection;
        proxy_read_timeout 3600s;
        client_max_body_size 100M;
    }

    # Office templates (.docx/.xlsx/.pptx) — Content-Type explicite
    location ~* \.(docx|xlsx|pptx)$ {
        expires off;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "inline";
        add_header Access-Control-Allow-Origin "*";
    }
}
