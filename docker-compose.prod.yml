# =============================================================================
#  docker-compose.prod.yml — Overlay de production Creative AI Studio
# =============================================================================
#  Utilisation (sur le serveur) :
#    cd /opt/creativeaistudio
#    docker compose --env-file .env \
#      -f docker-compose.yml -f docker-compose.prod.yml \
#      up -d <services...>
#
#  Ce fichier ne contient AUCUN secret en clair : toutes les valeurs sensibles
#  sont injectées depuis le fichier .env (non versionné) via ${VAR:?}.
#  En cas d'oubli d'une variable → docker compose refuse de démarrer
#  (mode "fail-fast") au lieu de démarrer avec une valeur vide.
#
#  Le fichier docker-compose.yml de base reste le fichier "développement"
#  avec des valeurs par défaut locales ; cet overlay ne sert QUE à la prod.
# =============================================================================

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL:-https://minio.labibpro.com}

  video-generation-worker:
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}
      VIDEO_GENERATION_PROVIDER: ${VIDEO_GENERATION_PROVIDER:-local}
      VIDEO_GENERATION_OLLAMA_URL: ${VIDEO_GENERATION_OLLAMA_URL:-http://ollama:11434}
      VIDEO_GENERATION_OLLAMA_MODEL: ${VIDEO_GENERATION_OLLAMA_MODEL:-qwen2.5:3b}
      VIDEO_GENERATION_LLM_PROVIDER: ${VIDEO_GENERATION_LLM_PROVIDER:-ollama}
      VIDEO_GENERATION_LLM_BASE_URL: ${VIDEO_GENERATION_LLM_BASE_URL:-}
      VIDEO_GENERATION_LLM_API_KEY: ${VIDEO_GENERATION_LLM_API_KEY:-}
      VIDEO_GENERATION_LLM_MODEL: ${VIDEO_GENERATION_LLM_MODEL:-}
      VIDEO_GENERATION_LLM_ALLOW_UNAUTHENTICATED: ${VIDEO_GENERATION_LLM_ALLOW_UNAUTHENTICATED:-false}
      VIDEO_GENERATION_LLM_TIMEOUT_SECONDS: ${VIDEO_GENERATION_LLM_TIMEOUT_SECONDS:-120}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      VIDEO_GENERATION_MUSIC_DIR: ${VIDEO_GENERATION_MUSIC_DIR:-}
      MONEYPRINTER_API_URL: ${MONEYPRINTER_API_URL:-}
      MONEYPRINTER_API_KEY: ${MONEYPRINTER_API_KEY:-}
      VIDEO_GENERATION_OUTPUT_BUCKET: ${VIDEO_GENERATION_OUTPUT_BUCKET:-video-generation-results}

  image-generation-worker:
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}
      IMAGE_PROVIDER_URL: ${IMAGE_PROVIDER_URL:-}
      IMAGE_PROVIDER_API_KEY: ${IMAGE_PROVIDER_API_KEY:-}
      IMAGE_PROVIDER_ALLOW_UNAUTHENTICATED: ${IMAGE_PROVIDER_ALLOW_UNAUTHENTICATED:-false}
      IMAGE_PROVIDER_AUTH_HEADER: ${IMAGE_PROVIDER_AUTH_HEADER:-Authorization}
      IMAGE_PROVIDER_AUTH_SCHEME: ${IMAGE_PROVIDER_AUTH_SCHEME:-Bearer}
      IMAGE_PROVIDER_API_PATH: ${IMAGE_PROVIDER_API_PATH:-/v1/images/generations}
      IMAGE_PROVIDER_SUPPORTS_NEGATIVE_PROMPT: ${IMAGE_PROVIDER_SUPPORTS_NEGATIVE_PROMPT:-false}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_GENERATION_OUTPUT_BUCKET: ${IMAGE_GENERATION_OUTPUT_BUCKET:-image-generation-results}

  # ── API Gateway ────────────────────────────────────────────────────────────

  api-gateway:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env}

  # ── Auth Service (OTP / JWT / Gmail) ────────────────────────────────────────

  auth-service:
    environment:
      DB_USER: creativeai
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requis dans .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio.labibpro.com}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-contact@labibpro.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD requis dans .env}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-https://ai.labibpro.com/api/auth/gmail/callback}
      GMAIL_FRONTEND_REDIRECT: ${GMAIL_FRONTEND_REDIRECT:-https://ai.labibpro.com/agentique/email}

  # ── Search Service ─────────────────────────────────────────────────────────

  search-service:
    environment:
      DB_USER: creativeai
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}

  # ── DocFusion Service ──────────────────────────────────────────────────────

  docfusion-service:
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio.labibpro.com}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}

  # ── RAG Service ────────────────────────────────────────────────────────────

  rag-service:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}

  # ── Agent Team Service ─────────────────────────────────────────────────────
  # !override : on REMPLACE la liste des dépendances de base (qui incluait
  # ollama) pour que le service démarre SANS le LLM local en production.

  agent-team-service:
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started
      minio:
        condition: service_started
      # Repris ici parce que ce depends_on est un !override : sans cette ligne,
      # la prod perd la dépendance au scanner et les uploads peuvent être
      # refusés (fail-closed) parce que le scanner n'est pas encore prêt.
      file-security-service:
        condition: service_started
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://ai.labibpro.com}
      # URL du frontend servi par le vhost nginx : cible de la redirection
      # navigateur au retour du callback OAuth. Fail-fast : une valeur absente
      # renverrait l'utilisateur vers localhost:4400, hors de l'application.
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?APP_FRONTEND_URL requis dans .env}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio.labibpro.com}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}
      # L'historique Flyway de la prod a divergé de celui du dépôt : V30 y est
      # appliquée alors que V27 et V29 ne le sont pas. À la validation, Flyway
      # les voit comme « en attente mais d'un rang inférieur au maximum appliqué »
      # et refuse de démarrer le service. Les trois migrations concernées sont
      # idempotentes (ajout de colonnes IF NOT EXISTS, réécriture de lignes
      # ciblées) et V29 corrige au passage une version d'API Meta expirée
      # (v19.0) restée en place. L'appliquer hors ordre converge l'historique
      # au lieu de le laisser divergent.
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-contact@labibpro.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD requis dans .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Secrets webhook : laissés optionnels, mais ABSENTS = webhooks fermés.
      # Les définir est ce qui active les réceptions Meta/Telegram.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:-}
      INSTAGRAM_VERIFY_TOKEN: ${INSTAGRAM_VERIFY_TOKEN:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Publication programmée : secret partagé des deux côtés (fail-closed si absent).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}

  # ── Scanner de fichiers ────────────────────────────────────────────────────
  # Les uploads de agent-team-service sont fail-closed : sans ce service, tout
  # upload renvoie 503. Il n'est PAS exposé publiquement.

  file-security-service:
    restart: unless-stopped

  # ── Generation Service ─────────────────────────────────────────────────────
  # Publication sociale : activée explicitement dans .env (Facebook/Instagram
  # sont publies via agent-team-service, qui detient les credentials Meta).

  generation-service:
    # En prod, 127.0.0.1:8088 est déjà pris par visversa (proxy nginx). Le port
    # interne reste 8088 (api-gateway y parle par nom de service) ; seul le
    # port publié sur l'hôte change. !override remplace la liste du fichier de
    # base au lieu de s'y ajouter, sinon le bind sur 8088 echoue.
    ports: !override
      - "127.0.0.1:8099:8088"
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio.labibpro.com}
      AGENT_TEAM_BASE_URL: ${AGENT_TEAM_BASE_URL:-http://agent-team-service:8087}
      SOCIAL_PUBLISH_ENABLED: ${SOCIAL_PUBLISH_ENABLED:-false}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Publication programmée : secret partagé des deux côtés (fail-closed si absent).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}

  # ── Telegram MCP ───────────────────────────────────────────────────────────

  telegram-mcp-service:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-creativeai_bot}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  # ── Workers IA ─────────────────────────────────────────────────────────────

  audio-worker:
    environment:
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}

  face-worker:
    environment:
      SERP_API_KEY: ${SERP_API_KEY:-}
      NUMVERIFY_KEY: ${NUMVERIFY_KEY:-}
      BING_SEARCH_KEY: ${BING_SEARCH_KEY:-}

  video-worker:
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}

  pdf-worker:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}

  ocr-worker:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY requis dans .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY requis dans .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}