spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/creativeai_agents_test}
    username: ${TEST_DB_USER:creativeai}
    password: ${TEST_DB_PASSWORD:creativeai123}

  # Flyway runs against the Testcontainers DB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Disable Kafka auto-start in tests
  kafka:
    consumer:
      auto-startup: false

  # Embedded / no-op mail
  mail:
    host: localhost
    port: 25
    username: test
    password: test

  # Redis — use a real Redis or mock; disabled via MockBean in tests
  data:
    redis:
      host: localhost
      port: 6379

agent:
  jwt-secret: test-secret-key-that-is-long-enough-for-hs256-algorithm
  encryption-key: Q3JlYXRpdmVBSVN0dWRpb0tleUNoYW5nZU1lSW5Qcm9k

minio:
  endpoint: http://localhost:9400
  public-url: http://localhost:9400
  access-key: minioadmin
  secret-key: minioadmin
  bucket: agent-photos

logging:
  level:
    com.creativeai: DEBUG
    org.springframework.security: WARN
    org.flywaydb: WARN

management:
  health:
    mail:
      # TaskCreationFlowIT déclare @MockBean JavaMailSender, ce qui REMPLACE le
      # bean JavaMailSenderImpl. MailHealthIndicatorAutoConfiguration ne peut
      # alors plus construire son indicateur, et MailHealthContributor
      # échoue au démarrage du contexte sur "Beans must not be empty" — les 5
      # tests du IT échouaient avant même d'exécuter une seule assertion.
      # L'indicateur mail n'a aucun intérêt dans un test où l'envoi est mocké.
      enabled: false
    redis:
      # Même cause que pour le mail : @MockBean RedisConnectionFactory remplace
      # le bean que RedisHealthContributorAutoConfiguration attend, et le
      # composite échoue sur la même assertion.
      enabled: false
