server:
  port: 8080

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        response-timeout: 600s   # SSE / agentic loop peut prendre jusqu'à 10 min sur CPU Ollama
        connect-timeout: 10000   # 10s pour établir la connexion upstream
      default-filters:
        - name: RequestSize
          args:
            maxSize: 210MB
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4400"
              - "http://localhost"
              - "http://ai.labibpro.com"
              - "https://ai.labibpro.com"
            allowedOriginPatterns:
              - "https://*.labibpro.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth Service
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /${segment}

        # Gmail OAuth2 — callback public (pas de JWT requis)
        - id: gmail-callback
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/gmail/callback
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /${segment}

        # Gmail API — endpoints protégés (JWT requis)
        - id: gmail-api
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/gmail/**
          filters:
            - RewritePath=/api/gmail/(?<segment>.*), /gmail/${segment}

        # Search Service
        - id: search-service
          uri: http://${SEARCH_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/search/**
          filters:
            # - AuthenticationFilter
            - RewritePath=/api/search/(?<segment>.*), /search/${segment}

        # AI Audio Worker (Python)
        - id: audio-ai
          uri: http://${AUDIO_AI_HOST:localhost}:8001
          predicates:
            - Path=/api/ai/audio/**
          filters:
            - AuthenticationFilter

        # AI Video Worker (Python)
        - id: video-ai
          uri: http://${VIDEO_AI_HOST:localhost}:8002
          predicates:
            - Path=/api/ai/video/**
          filters:
            - AuthenticationFilter

        # AI Face Worker (Python)
        - id: face-ai
          uri: http://${FACE_AI_HOST:localhost}:8003
          predicates:
            - Path=/api/ai/face/**
          filters:
            - AuthenticationFilter

        # DocFusion Service (uploads protégés JWT — l'UI requiert déjà la connexion)
        - id: docfusion-service
          uri: http://${DOCFUSION_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/docfusion/**
          filters:
            - AuthenticationFilter
            - RewritePath=/api/docfusion/(?<segment>.*), /docfusion/${segment}

        # RAG Service
        - id: rag-service
          uri: http://${RAG_SERVICE_HOST:creativeai-rag}:8084
          predicates:
            - Path=/api/rag/**
          filters:
            # Sans ce filtre, /api/rag/ingest acceptait n'importe quel upload
            # et DELETE /api/rag/documents vidait toute la base de connaissance,
            # le tout sans jeton et depuis l'Internet public.
            - AuthenticationFilter
            - RewritePath=/api/rag/(?<segment>.*), /rag/${segment}

        # OCR Worker (Groq Vision → Tesseract fallback)
        - id: ocr-worker
          uri: http://${OCR_AI_HOST:creativeai-ocr-ai}:8005
          predicates:
            - Path=/api/ocr/**
          filters:
            - RewritePath=/api/ocr/(?<segment>.*), /ocr/${segment}

        # CV Workspace (analyses CV par utilisateur — auth gérée par le service)
        - id: cv-workspace
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/cv-workspace/**

        # Card Designs (créations graphiques par utilisateur)
        - id: card-designs
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/card-designs/**

        # Card Data (tables spécialisées par catégorie)
        - id: card-data
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/card-data/**

        # Card Persons (données personnes par catégorie de carte)
        - id: card-persons
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/card-persons/**

        # Card Entreprises (sociétés/organisations centralisées)
        - id: card-entreprises
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/card-entreprises/**

        # Generation Service (générations vidéo/image + publication sociale)
        - id: generation-service
          uri: http://${GENERATION_SERVICE_HOST:generation-service}:8088
          predicates:
            - Path=/api/generation/**
          filters:
            - AuthenticationFilter
            - RewritePath=/api/generation/(?<segment>.*), /api/generation/${segment}

        # Planning : publication différée. Route dédiée plutôt qu'un simple ajout
        # à /api/generation/** pour que l'URL reste lisible côté navigateur et
        # que le Planning puisse évoluer sans impacter les jobs.
        - id: scheduled-publications
          uri: http://${GENERATION_SERVICE_HOST:generation-service}:8088
          predicates:
            - Path=/api/scheduled-publications/**
          filters:
            - AuthenticationFilter

        # Repo planifié : /internal/** n'est délibérément routé nulle part.
        # Publication programmée = appel direct generation-service → agent-team.

        # ── Agent Team Service — DOIT être AVANT les routes agent génériques ──────
        - id: agent-team-agents
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/agents/**
          filters:
            - RewritePath=/api/agents/(?<segment>.*), /api/agents/${segment}

        - id: agent-team-teams
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/teams/**
          filters:
            - RewritePath=/api/teams/(?<segment>.*), /api/teams/${segment}

        - id: agent-team-tasks
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/tasks/**
          filters:
            - RewritePath=/api/tasks/(?<segment>.*), /api/tasks/${segment}

        - id: agent-team-workflows
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/workflows/**
          filters:
            - RewritePath=/api/workflows/(?<segment>.*), /api/workflows/${segment}

        - id: agent-team-inbox
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/inbox/**
          filters:
            - RewritePath=/api/inbox/(?<segment>.*), /api/inbox/${segment}

        - id: agent-team-enums
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/enums/**
          filters:
            - RewritePath=/api/enums/(?<segment>.*), /api/enums/${segment}

        - id: agent-team-audit
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/audit/**
          filters:
            - RewritePath=/api/audit/(?<segment>.*), /api/audit/${segment}

        - id: agent-team-facebook
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/facebook/**
          filters:
            - RewritePath=/api/facebook/(?<segment>.*), /api/facebook/${segment}

        # Instagram Graph API (connexion de compte, médias, publication)
        # + webhook Instagram. Route PUBLIQUE : Meta POSTe les notifications
        # sans JWT, et l'agent-team les valide lui-même (verify_token au GET,
        # X-Hub-Signature-256 au POST). Aucun AuthenticationFilter ici, sinon
        # Meta recevrait 401 et abandonnerait l'abonnement.
        - id: agent-team-instagram
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/instagram/**
          filters:
            - RewritePath=/api/instagram/(?<segment>.*), /api/instagram/${segment}

        # LLM providers du compte courant (CRUD rattaché à l'utilisateur)
        - id: agent-team-my-llm-providers
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/users/me/llm-providers/**

        # ── Email Agent (auth-service) — DOIT être AVANT la route agent générale ──
        - id: email-agent
          uri: http://${AUTH_SERVICE_HOST:creativeai-auth}:8081
          predicates:
            - Path=/api/agent/email/**
          filters:
            - RewritePath=/api/agent/email/(?<segment>.*), /api/agent/email/${segment}

        - id: agent-tasks
          uri: http://${AUTH_SERVICE_HOST:creativeai-auth}:8081
          predicates:
            - Path=/api/agent/tasks/**
          filters:
            - RewritePath=/api/agent/tasks/(?<segment>.*), /api/agent/tasks/${segment}

        - id: agent-scheduled
          uri: http://${AUTH_SERVICE_HOST:creativeai-auth}:8081
          predicates:
            - Path=/api/agent/scheduled/**
          filters:
            - RewritePath=/api/agent/scheduled/(?<segment>.*), /api/agent/scheduled/${segment}

        - id: user-credentials
          uri: http://${AUTH_SERVICE_HOST:creativeai-auth}:8081
          predicates:
            - Path=/api/user/credentials/**
          filters:
            - RewritePath=/api/user/credentials/(?<segment>.*), /api/user/credentials/${segment}

        - id: user-profil
          uri: http://${AUTH_SERVICE_HOST:creativeai-auth}:8081
          predicates:
            - Path=/api/user/profil/**
          filters:
            - RewritePath=/api/user/profil(?<segment>.*), /api/user/profil${segment}

        - id: user-clients
          uri: http://${AUTH_SERVICE_HOST:creativeai-auth}:8081
          predicates:
            - Path=/api/user/clients/**
          filters:
            - RewritePath=/api/user/clients(?<segment>.*), /api/user/clients${segment}

        - id: user-products
          uri: http://${AUTH_SERVICE_HOST:creativeai-auth}:8081
          predicates:
            - Path=/api/user/products/**
          filters:
            - RewritePath=/api/user/products(?<segment>.*), /api/user/products${segment}

        # Upload de médias — authentifié : un upload sans JWT est refusé à la
        # gateway (et une seconde fois par SecurityConfig côté agent-team).
        - id: media-upload
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/media/**
          filters:
            - RewritePath=/api/media/(?<segment>.*), /api/media/${segment}
            - name: AuthenticationFilter


        # OAuth Social Networks (wizard non-technique)
        #
        # Deux routes distinctes, et c'est volontaire :
        #  - /authorize et /status sont appelés par le frontend porteur du JWT ;
        #  - /callback est une redirection navigateur de la plateforme, sans
        #    Authorization. Lui mettre le filtre renverrait 401 et casserait
        #    toute connexion. Sa sécurité tient au `state` opaque à usage unique
        #    (OAuthStateStore), pas à un permitAll de préfixe.
        - id: oauth-social-authorize
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/oauth/social/*/authorize,/api/oauth/social/status/**
          filters:
            - RewritePath=/api/oauth/social/(?<segment>.*), /api/oauth/social/${segment}
            - name: AuthenticationFilter

        - id: oauth-social-callback
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/oauth/social/*/callback
          filters:
            - RewritePath=/api/oauth/social/(?<segment>.*), /api/oauth/social/${segment}

        # Alias du callback Facebook pour l'URI déclarée dans la console Meta
        # (https://api.ai.labibpro.com/api/v1/oauth/facebook/callback). Meta
        # exige que le redirect_uri serve exactement cette URL : on la re-route
        # vers le handler historique. Publique, comme le callback d'origine.
        - id: oauth-social-callback-v1
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/v1/oauth/facebook/callback
          filters:
            - RewritePath=/api/v1/oauth/facebook/callback, /api/oauth/social/facebook/callback

        # Webhook de désautorisation Facebook (deauthorize callback) : Meta le
        # POSTe sans JWT, la confiance vient du signed_request HMAC-SHA256.
        # Doit rester PUBLIC — `default-filters` ne contient QUE RequestSize,
        # AuthenticationFilter n'est appliqué que là où il est nommé
        # explicitement. Ne pas l'ajouter ici.
        - id: oauth-social-deauthorize
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/oauth/social/facebook/deauthorize
          filters:
            - RewritePath=/api/oauth/social/(?<segment>.*), /api/oauth/social/${segment}

        # Choix de la Page sur un canal existant (Facebook / Instagram).
        # Route distincte de /authorize : elle échappe volontairement au
        #permitAll du callback, le JWT est obligatoire (AuthenticationFilter).
        - id: oauth-social-pages
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/oauth/social/*/pages/**
          filters:
            - RewritePath=/api/oauth/social/(?<segment>.*), /api/oauth/social/${segment}
            - name: AuthenticationFilter

        # Administration des réseaux sociaux d'entreprise (plateformes + comptes).
        # Le contrôleur porte déjà @PreAuthorize("hasRole('ADMIN')") : le gateway
        # exige seulement un JWT valide, le rôle est décidé par le service.
        - id: admin-social
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/admin/social/**
          filters:
            - name: AuthenticationFilter

        # Rédaction assistée d'une légende depuis l'onglet Planning.
        # JWT obligatoire : la génération de texte consomme des crédits.
        - id: social-caption
          uri: http://${AGENT_TEAM_SERVICE_HOST:agent-team-service}:8087
          predicates:
            - Path=/api/social/caption
          filters:
            - name: AuthenticationFilter



        # File Security Service (Scan & Sanitize) — jamais accessible sans JWT :
        # le scan est un service interne, l'exposer reviendrait à offrir à
        # quiconque un oracle de détection et un relais de fichiers.
        - id: file-security
          uri: http://${FILE_SECURITY_HOST:file-security-service}:8090
          predicates:
            - Path=/api/security/files/**
          filters:
            - RewritePath=/api/security/files/(?<segment>.*), /${segment}
            - name: AuthenticationFilter

        # Agentique IA — agents RAG (chemin /agent/* général — APRÈS les routes spécifiques)
        - id: agent-service
          uri: http://${RAG_SERVICE_HOST:creativeai-rag}:8084
          predicates:
            - Path=/api/agent/**
          filters:
            - RewritePath=/api/agent/(?<segment>.*), /agent/${segment}

app:
  jwt:
    secret: ${JWT_SECRET:creativeaistudio-super-secret-key-that-is-long-enough-for-hs256}
    expiration: 86400000  # 24h en ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Authentication
        url: /api/auth/v3/api-docs
      - name: Search AI
        url: /api/search/v3/api-docs
      - name: Agent Team Service
        url: /api/agents/v3/api-docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
