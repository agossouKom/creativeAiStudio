server:
  port: 8083

spring:
  application:
    name: docfusion-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/creativeai_docfusion
    username: ${DB_USER:creativeai}
    password: ${DB_PASSWORD:creativeai123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: docfusion-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:creativeai}
  secret-key: ${MINIO_SECRET_KEY:creativeai123}
  bucket: docfusion-jobs
  result-bucket: docfusion-results
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9400}

springdoc:
  api-docs:
    path: /docfusion/v3/api-docs
